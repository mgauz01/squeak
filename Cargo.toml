[package]
name = "squeak"
version = "0.1.0"
edition = "2021"
description = "Local Windows voice dictation (Wispr-core subset)"
license = "MIT"
readme = "README.md"

[lib]
name = "squeak"
path = "src/lib.rs"

[[bin]]
name = "squeak"
path = "src/main.rs"

[features]
default = []
directml = ["transcribe-rs/ort-directml"]

[dependencies]
crossbeam-channel = "0.5"
dirs = "5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
arboard = "3"
cpal = "0.15"
enigo = "0.3"
muda = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rubato = "0.15"
tao = "0.30"
tauri-winrt-notification = "0.2"
tray-icon = "0.19"
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
] }

[dev-dependencies]
pretty_assertions = "1"
