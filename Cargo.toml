[package]
name = "squeak"
version = "0.1.0"
edition = "2021"
description = "Local Windows voice dictation (Wispr-core subset)"
license = "MIT"
readme = "README.md"

[lib]
name = "squeak"
path = "src/lib.rs"

[[bin]]
name = "squeak"
path = "src/main.rs"

[[example]]
name = "asr_smoke"
path = "examples/asr_smoke.rs"
required-features = []

[[example]]
name = "gec_smoke"
path = "examples/gec_smoke.rs"
required-features = ["gec-tiny"]

[[example]]
name = "gec_bench"
path = "examples/gec_bench.rs"
required-features = ["gec-tiny", "gec-coedit"]

[features]
default = ["parakeet"]
parakeet = []
cohere = []
canary = []
gec-tiny = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
gec-coedit = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
gec-llama = []
directml = ["transcribe-rs/ort-directml"]

[dependencies]
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
muda = "0.15"
hound = "3"
ureq = "3.3"
flate2 = "1"
tar = "0.4"
tray-icon = "0.19"
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["download-binaries", "ndarray"] }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.16", optional = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }

[dev-dependencies]
pretty_assertions = "1"
