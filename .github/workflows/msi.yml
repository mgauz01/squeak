name: Build MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: msi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Unit tests
        run: cargo test

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Add MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare models cache directory
        shell: pwsh
        run: |
          $models = Join-Path $env:LOCALAPPDATA 'Squeak\models'
          New-Item -ItemType Directory -Force -Path $models | Out-Null
          "MODELS_CACHE_PATH=$models" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: ${{ env.MODELS_CACHE_PATH }}
          key: squeak-models-${{ runner.os }}-parakeet-v1
          restore-keys: |
            squeak-models-${{ runner.os }}-

      - name: Windows validation (check + smoke + bench)
        shell: pwsh
        run: ./scripts/ci/windows-validate.ps1

      - name: Upload ASR bench log
        uses: actions/upload-artifact@v4
        with:
          name: asr-bench-${{ github.sha }}
          path: asr-bench.log
          if-no-files-found: error

  build-msi:
    needs: [validate-linux, validate-windows]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Add MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command candle -ErrorAction SilentlyContinue) {
            Write-Host 'WiX already installed (candle on PATH).'
            exit 0
          }
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (Test-Path (Join-Path $wixBin 'candle.exe')) {
            Write-Host "WiX found at $wixBin"
            echo "$wixBin" >> $env:GITHUB_PATH
            exit 0
          }
          choco install wixtoolset -y --no-progress

      - name: Build MSI
        shell: pwsh
        run: ./installer/build.ps1 -Features parakeet

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: squeak-msi-${{ github.sha }}
          path: dist/*.msi
          if-no-files-found: error

      - name: Upload MSI to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          generate_release_notes: true
