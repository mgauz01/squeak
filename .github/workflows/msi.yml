name: Build MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command candle -ErrorAction SilentlyContinue) {
            Write-Host 'WiX already installed (candle on PATH).'
            exit 0
          }
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (Test-Path (Join-Path $wixBin 'candle.exe')) {
            Write-Host "WiX found at $wixBin"
            echo "$wixBin" >> $env:GITHUB_PATH
            exit 0
          }
          choco install wixtoolset -y --no-progress

      - name: Build MSI
        shell: pwsh
        run: ./installer/build.ps1 -Features parakeet

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: squeak-msi-${{ github.sha }}
          path: dist/*.msi
          if-no-files-found: error

      - name: Upload MSI to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          generate_release_notes: true
